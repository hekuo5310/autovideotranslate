<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AutoVideoTranslate</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#111;background:#fff;--line:#e7e7e7;--muted:#6b6b6b;--soft:#f7f7f7}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111}button,input{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;background:#fff}
.brand{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:28px}
.navbtn{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;margin-bottom:14px}
.project-list{display:grid;gap:8px;overflow:auto;max-height:calc(100vh - 155px)}
.project-item{border:1px solid transparent;background:#fff;border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.project-item:hover,.project-item.active{background:var(--soft);border-color:var(--line)}
.project-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.main{padding:34px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
.topbar h1{font-size:30px;margin:0;letter-spacing:-.04em}.health{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#bbb}.dot.ok{background:#111}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:22px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}.card h2{font-size:16px;margin:0 0 16px}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed #d5d5d5;border-radius:16px}
.video-wrap{background:#0a0a0a;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.video-wrap video{width:100%;height:100%;object-fit:contain}.video-empty{color:#aaa;font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid #111;background:#111;color:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:#111}.btn:disabled{opacity:.4;cursor:not-allowed}.status{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--soft)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.metric{background:var(--soft);border-radius:12px;padding:13px}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font-size:14px;word-break:break-all}
.upload{border:1px dashed #cfcfcf;border-radius:14px;padding:18px;text-align:center}.upload input{display:none}.upload label{display:block;cursor:pointer;font-weight:700}.upload p{font-size:12px;color:var(--muted);margin:7px 0 0}.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#111;transition:width .2s}.progress-text{font-size:12px;color:var(--muted);margin-top:7px;display:none}
.stage-list{display:grid;gap:9px}.stage{display:flex;align-items:center;gap:10px;font-size:13px;color:#888}.stage .n{width:24px;height:24px;border-radius:50%;border:1px solid #ddd;display:grid;place-items:center;font-size:11px}.stage.done,.stage.current{color:#111}.stage.done .n{background:#111;color:#fff;border-color:#111}.stage.current .n{border-color:#111;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{background:#fff;border-radius:18px;padding:22px;width:min(420px,100%);box-shadow:0 20px 70px rgba(0,0,0,.16)}.dialog h2{margin:0 0 14px}.input{width:100%;border:1px solid #ccc;border-radius:11px;padding:11px 12px;margin-bottom:14px}.notice{font-size:12px;color:var(--muted);line-height:1.6}.error{color:#a40000;font-size:12px;margin-top:10px;white-space:pre-wrap}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.project-list{max-height:220px}.main{padding:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">AutoVideoTranslate</div>
    <div class="sub">AI 烤肉工作台</div>
    <button class="navbtn" id="newProject">+ 新建项目</button>
    <div class="project-list" id="projectList"></div>
  </aside>
  <main class="main">
    <div class="topbar"><h1 id="pageTitle">项目</h1><div class="health"><span class="dot" id="healthDot"></span><span id="healthText">检查服务…</span></div></div>
    <div id="welcome" class="empty">从左侧选择项目，或新建一个视频翻译项目。</div>
    <div id="workspace" class="grid" hidden>
      <section>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:16px"><div class="row"><span class="status" id="stageBadge">CREATED</span><span id="updatedAt" class="notice"></span></div><button class="btn secondary" id="refreshBtn">刷新</button></div>
          <div class="video-wrap" id="videoWrap"><div class="video-empty">上传源视频后可在这里预览</div></div>
          <div class="details" id="mediaDetails"></div>
        </div>
        <div class="card" style="margin-top:22px">
          <h2>源视频</h2>
          <div class="upload" id="uploadBox">
            <input type="file" id="fileInput" accept="video/*" />
            <label for="fileInput">选择视频并上传到 R2</label>
            <p>使用 R2 Multipart Upload，8 MiB 分片。上传完成后会自动进入媒体分析。</p>
            <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
            <div class="progress-text" id="progressText"></div><div class="error" id="uploadError"></div>
          </div>
        </div>
        <div class="card" style="margin-top:22px">
          <div class="row" style="justify-content:space-between"><div><h2 style="margin-bottom:5px">成片渲染</h2><div class="notice">当前第一版没有字幕/配音时会直接复制源视频；接入字幕或配音后再进行必要的 FFmpeg 处理。</div></div><button class="btn" id="renderBtn">开始渲染</button></div>
          <div id="outputArea" style="margin-top:16px"></div>
        </div>
      </section>
      <aside>
        <div class="card"><h2>流水线</h2><div class="stage-list" id="stageList"></div></div>
        <div class="card" style="margin-top:22px"><h2>运行信息</h2><pre id="runtime" style="margin:0;background:var(--soft);border-radius:12px;padding:13px;white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:360px;overflow:auto">—</pre></div>
      </aside>
    </div>
  </main>
</div>
<div class="modal" id="modal"><div class="dialog"><h2>新建项目</h2><input class="input" id="projectName" placeholder="例如：EP01 中文字幕" /><div class="row" style="justify-content:flex-end"><button class="btn secondary" id="cancelCreate">取消</button><button class="btn" id="confirmCreate">创建</button></div><div class="error" id="createError"></div></div></div>
<script>
const $ = (s) => document.querySelector(s);
const state = { projects: [], selected: null, detail: null, uploading: false, timer: null };
const stages = ["CREATED","UPLOADING","UPLOADED","ANALYZING","TRANSCRIBING","TRANSLATING","AI_QA","WAITING_TRANSLATION_REVIEW","TTS_GENERATING","TTS_QA","WAITING_DUB_REVIEW","RENDER_QUEUED","RENDERING","WAITING_FINAL_REVIEW","COMPLETED"];
const stageNames = {CREATED:"已创建",UPLOADING:"上传中",UPLOADED:"已上传",ANALYZING:"媒体分析",TRANSCRIBING:"识别中",TRANSLATING:"翻译中",AI_QA:"AI 质检",WAITING_TRANSLATION_REVIEW:"等待字幕审核",TTS_GENERATING:"生成配音",TTS_QA:"配音质检",WAITING_DUB_REVIEW:"等待配音审核",RENDER_QUEUED:"等待渲染",RENDERING:"渲染中",WAITING_FINAL_REVIEW:"等待成片终审",COMPLETED:"已完成",FAILED:"失败"};
async function api(path, options={}) { const r=await fetch(path,options); const type=r.headers.get("content-type")||""; const body=type.includes("application/json")?await r.json():await r.text(); if(!r.ok) throw new Error(typeof body==="string"?body:(body.error||JSON.stringify(body))); return body; }
function fmtDate(ts){if(!ts)return"";return new Date(Number(ts)).toLocaleString()}
function fmtBytes(n){if(!n&&n!==0)return"—";const u=["B","KiB","MiB","GiB"];let i=0,v=Number(n);while(v>=1024&&i<u.length-1){v/=1024;i++}return `${v.toFixed(i?1:0)} ${u[i]}`}
async function checkHealth(){try{const h=await api("/api/health");$("#healthDot").classList.add("ok");$("#healthText").textContent=`服务正常 · ${h.storage.toUpperCase()}`}catch{$("#healthText").textContent="服务异常"}}
async function loadProjects(selectId){const data=await api("/api/projects");state.projects=data.projects||[];renderProjectList();if(selectId)await selectProject(selectId);else if(state.selected)await selectProject(state.selected)}
function renderProjectList(){const box=$("#projectList");box.innerHTML="";if(!state.projects.length){box.innerHTML='<div class="notice" style="padding:10px">还没有项目</div>';return}for(const p of state.projects){const b=document.createElement("button");b.className="project-item"+(p.id===state.selected?" active":"");b.innerHTML=`<div class="project-title"></div><div class="project-meta"><span>${stageNames[p.stage]||p.stage}</span><span>${fmtDate(p.updated_at)}</span></div>`;b.querySelector(".project-title").textContent=p.title;b.onclick=()=>selectProject(p.id);box.appendChild(b)}}
async function selectProject(id){state.selected=id;renderProjectList();$("#welcome").hidden=true;$("#workspace").hidden=false;try{state.detail=await api(`/api/projects/${encodeURIComponent(id)}`);renderDetail();schedulePoll()}catch(e){alert(e.message)}}
function renderStages(stage){const box=$("#stageList");box.innerHTML="";const current=stages.indexOf(stage);stages.forEach((s,i)=>{const d=document.createElement("div");d.className="stage "+(stage==="FAILED"?"":i<current?"done":i===current?"current":"");d.innerHTML=`<span class="n">${i+1}</span><span>${stageNames[s]||s}</span>`;box.appendChild(d)});if(stage==="FAILED"){const d=document.createElement("div");d.className="stage current";d.innerHTML='<span class="n">!</span><span>任务失败</span>';box.prepend(d)}}
function renderDetail(){
  const {project,runtime}=state.detail;state.selected=project.id;$("#pageTitle").textContent=project.title;$("#stageBadge").textContent=stageNames[project.stage]||project.stage;$("#updatedAt").textContent=fmtDate(project.updated_at);renderStages(project.stage);$("#runtime").textContent=JSON.stringify(runtime||{},null,2);
  let meta={};try{meta=project.metadata_json?JSON.parse(project.metadata_json):{}}catch{}const video=meta.video||{},audio=meta.audio||{};
  $("#mediaDetails").innerHTML=`<div class="metric"><small>时长</small><strong>${meta.duration?Number(meta.duration).toFixed(1)+" s":"—"}</strong></div><div class="metric"><small>大小</small><strong>${fmtBytes(meta.size)}</strong></div><div class="metric"><small>视频</small><strong>${video.codec||"—"} ${video.width?video.width+"×"+video.height:""}</strong></div><div class="metric"><small>音频</small><strong>${audio.codec||"—"} ${audio.channels?audio.channels+" ch":""}</strong></div>`;
  const wrap=$("#videoWrap");if(project.source_key){wrap.innerHTML=`<video controls preload="metadata" src="/api/projects/${encodeURIComponent(project.id)}/media?target=source"></video>`}else{wrap.innerHTML='<div class="video-empty">上传源视频后可在这里预览</div>'}
  const renderActive=["RENDER_QUEUED","RENDERING"].includes(project.stage);const btn=$("#renderBtn");btn.disabled=!project.source_key||["UPLOADING","ANALYZING"].includes(project.stage)||renderActive;btn.textContent=project.stage==="RENDER_QUEUED"?"等待渲染":project.stage==="RENDERING"?"正在渲染":project.output_key?"重新渲染":"开始渲染";
  const out=$("#outputArea");
  if(project.output_key){out.innerHTML=`<div class="video-wrap"><video controls preload="metadata" src="/api/projects/${encodeURIComponent(project.id)}/media?target=output"></video></div><div class="row" style="margin-top:10px"><a class="btn secondary" style="text-decoration:none" href="/api/projects/${encodeURIComponent(project.id)}/media?target=output" target="_blank">打开成片</a></div>`}
  else if(project.stage==="RENDER_QUEUED"){out.innerHTML='<div class="notice">渲染任务已提交，正在等待 Container 执行…</div>'}
  else if(project.stage==="RENDERING"){out.innerHTML='<div class="notice">正在渲染并写回 R2，请保持页面打开；状态会自动刷新。</div>'}
  else if(project.stage==="FAILED"){out.innerHTML=`<div class="error">任务失败：${runtime?.error||"请查看运行信息"}</div>`}
  else{out.innerHTML='<div class="notice">尚未开始渲染。</div>'}
}
function schedulePoll(){clearTimeout(state.timer);if(!state.selected)return;const active=state.detail&&["UPLOADING","UPLOADED","ANALYZING","TRANSCRIBING","TRANSLATING","AI_QA","TTS_GENERATING","TTS_QA","RENDER_QUEUED","RENDERING"].includes(state.detail.project.stage);state.timer=setTimeout(async()=>{if(!state.selected)return;try{state.detail=await api(`/api/projects/${encodeURIComponent(state.selected)}`);renderDetail();await loadProjects()}catch{}schedulePoll()},active?2500:8000)}
async function uploadFile(file){if(!state.selected||state.uploading)return;state.uploading=true;$("#uploadError").textContent="";$("#progress").style.display="block";$("#progressText").style.display="block";$("#bar").style.width="0%";let session=null;try{session=await api(`/api/projects/${encodeURIComponent(state.selected)}/uploads/init`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({filename:file.name,contentType:file.type||"application/octet-stream"})});const size=8*1024*1024,parts=[];const count=Math.ceil(file.size/size);for(let i=0;i<count;i++){const chunk=file.slice(i*size,Math.min(file.size,(i+1)*size));const q=new URLSearchParams({key:session.key,uploadId:session.uploadId,partNumber:String(i+1)});const part=await api(`/api/projects/${encodeURIComponent(state.selected)}/uploads/part?${q}`,{method:"PUT",body:chunk});parts.push(part);const pct=Math.round(((i+1)/count)*100);$("#bar").style.width=pct+"%";$("#progressText").textContent=`上传 ${i+1}/${count} · ${pct}%`}await api(`/api/projects/${encodeURIComponent(state.selected)}/uploads/complete`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key:session.key,uploadId:session.uploadId,parts})});$("#progressText").textContent="上传完成，正在分析媒体…";await selectProject(state.selected);await loadProjects()}catch(e){$("#uploadError").textContent=e.message;if(session){try{await api(`/api/projects/${encodeURIComponent(state.selected)}/uploads/abort`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key:session.key,uploadId:session.uploadId})})}catch{}}}finally{state.uploading=false;$("#fileInput").value=""}}
$("#newProject").onclick=()=>{$("#modal").classList.add("open");$("#projectName").focus()};
$("#cancelCreate").onclick=()=>$("#modal").classList.remove("open");
$("#confirmCreate").onclick=async()=>{const name=$("#projectName").value.trim();$("#createError").textContent="";try{const p=await api("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:name||"未命名项目"})});$("#modal").classList.remove("open");$("#projectName").value="";await loadProjects(p.id)}catch(e){$("#createError").textContent=e.message}};
$("#fileInput").onchange=e=>{const file=e.target.files?.[0];if(file)uploadFile(file)};
$("#refreshBtn").onclick=()=>state.selected&&selectProject(state.selected);
$("#renderBtn").onclick=async()=>{if(!state.selected)return;const btn=$("#renderBtn");btn.disabled=true;btn.textContent="提交中";$("#outputArea").innerHTML='<div class="notice">正在提交渲染任务…</div>';try{await api(`/api/projects/${encodeURIComponent(state.selected)}/render`,{method:"POST",headers:{"content-type":"application/json"},body:"{}"});$("#outputArea").innerHTML='<div class="notice">渲染任务已提交，正在等待 Container 执行…</div>';await selectProject(state.selected);await loadProjects()}catch(e){$("#outputArea").innerHTML=`<div class="error">提交渲染失败：${e.message}</div>`;btn.disabled=false;btn.textContent="重试渲染"}};
$("#projectName").onkeydown=e=>{if(e.key==="Enter")$("#confirmCreate").click()};
checkHealth();loadProjects().catch(e=>{$("#welcome").textContent="加载失败："+e.message});
</script>
</body>
</html>

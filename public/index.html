<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoVideoTranslate</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#111;background:#fff;--line:#e7e7e7;--muted:#6b6b6b;--soft:#f7f7f7;--danger:#a40000}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.sidebar{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin-bottom:4px}.sub,.muted{font-size:12px;color:var(--muted)}.navbtn,.btn{border:1px solid #111;background:#111;color:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.navbtn{width:100%;text-align:left;margin:24px 0 14px}.btn.secondary{background:#fff;color:#111}.btn:disabled{opacity:.4;cursor:not-allowed}.project-list{display:grid;gap:7px;overflow:auto;max-height:calc(100vh - 150px)}.project-item{border:1px solid transparent;background:#fff;border-radius:12px;padding:11px 12px;text-align:left}.project-item:hover,.project-item.active{background:var(--soft);border-color:var(--line)}.project-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{font-size:11px;color:var(--muted);margin-top:4px}.main{padding:32px;min-width:0}.topbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topbar{justify-content:space-between;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.health{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff;margin-bottom:20px}.card h2{font-size:16px;margin:0 0 14px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.65fr);gap:20px}.video-wrap{background:#080808;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.video-wrap video{width:100%;height:100%;object-fit:contain}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed #d5d5d5;border-radius:14px}.status{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:var(--soft);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);margin-bottom:4px}.upload{border:1px dashed #ccc;border-radius:14px;padding:18px;text-align:center}.upload input{display:none}.upload label{font-weight:700;cursor:pointer}.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-top:12px;display:none}.bar{height:100%;background:#111;width:0}.error{color:var(--danger);font-size:12px;white-space:pre-wrap}.stages{display:grid;gap:8px}.stage{font-size:12px;color:#999;display:flex;gap:8px;align-items:center}.stage.current,.stage.done{color:#111}.stage i{font-style:normal;border:1px solid #ddd;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}.stage.done i{background:#111;color:#fff}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.segwrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:14px}.segments{width:100%;border-collapse:collapse;min-width:900px}.segments th,.segments td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;font-size:12px}.segments th{position:sticky;top:0;background:#fff;z-index:1}.segments textarea,.segments input{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px;background:#fff}.segments textarea{min-height:62px;resize:vertical}.flag{font-size:10px;border:1px solid #ddd;border-radius:999px;padding:3px 6px;display:inline-block;margin:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{background:#fff;border-radius:18px;padding:22px;width:min(420px,100%)}.input{width:100%;border:1px solid #ccc;border-radius:10px;padding:11px;margin:10px 0 14px}.notice{font-size:12px;color:var(--muted);line-height:1.55}.select{border:1px solid #ccc;border-radius:10px;padding:9px;background:#fff}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.layout{grid-template-columns:1fr}.main{padding:20px}.details{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">AutoVideoTranslate</div><div class="sub">AI 烤肉工作台</div><button class="navbtn" id="newProject">+ 新建项目</button><div id="projectList" class="project-list"></div></aside>
<main class="main"><div class="topbar"><h1 id="pageTitle">项目</h1><div id="health" class="health">检查服务…</div></div><div id="welcome" class="empty">选择一个项目，或新建项目上传视频。</div>
<div id="workspace" hidden><div class="layout"><section>
<div class="card"><div class="toolbar"><div class="row"><span id="stageBadge" class="status">CREATED</span><span id="updatedAt" class="muted"></span></div><button id="refreshBtn" class="btn secondary">刷新</button></div><div id="videoWrap" class="video-wrap"><span class="muted">上传视频后可预览</span></div><div id="mediaDetails" class="details"></div></div>
<div class="card"><h2>源视频</h2><div class="upload"><input id="fileInput" type="file" accept="video/*"><label for="fileInput">选择视频并上传</label><div class="notice">上传后会自动：媒体分析 → Gemini 识别 → 中文翻译 → AI 质检。</div><div id="progress" class="progress"><div id="bar" class="bar"></div></div><div id="progressText" class="notice"></div><div id="uploadError" class="error"></div></div></div>
<div class="card" id="subtitleCard"><div class="toolbar"><div><h2 style="margin-bottom:4px">字幕与翻译审核</h2><div class="notice">可直接修改译文或说话人，离开输入框自动保存。</div></div><div class="row"><button id="retryProcess" class="btn secondary">重新识别翻译</button><select id="voice" class="select"><option>冰糖</option><option>茉莉</option><option>苏打</option><option>白桦</option></select><button id="approveTranslation" class="btn">确认字幕并生成配音</button></div></div><div id="segmentEmpty" class="empty">识别翻译完成后，字幕会出现在这里。</div><div id="segmentWrap" class="segwrap" hidden><table class="segments"><thead><tr><th># / 时间</th><th>说话人</th><th>原文</th><th>中文译文</th><th>状态</th></tr></thead><tbody id="segmentBody"></tbody></table></div></div>
<div class="card"><div class="toolbar"><div><h2 style="margin-bottom:4px">配音与成片</h2><div id="renderHint" class="notice">字幕确认后会生成 MiMo 分段配音、ASS，再由 FFmpeg 合成。</div></div><div class="row"><button id="approveDub" class="btn secondary">配音通过并渲染</button><button id="renderBtn" class="btn">开始渲染</button><button id="completeBtn" class="btn secondary">终审通过</button></div></div><div id="outputArea"></div></div>
</section><aside><div class="card"><h2>流水线</h2><div id="stageList" class="stages"></div></div><div class="card"><h2>运行信息</h2><pre id="runtime" style="font-size:11px;white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:12px;border-radius:12px;max-height:420px;overflow:auto">—</pre></div></aside></div></div></main></div>
<div id="modal" class="modal"><div class="dialog"><h2>新建项目</h2><input id="projectName" class="input" placeholder="例如：EP01 中文字幕"><div class="row" style="justify-content:flex-end"><button id="cancelCreate" class="btn secondary">取消</button><button id="confirmCreate" class="btn">创建</button></div><div id="createError" class="error"></div></div></div>
<script>
const $=s=>document.querySelector(s);const state={projects:[],selected:null,detail:null,segments:[],timer:null,uploading:false};
const stages=["CREATED","UPLOADING","UPLOADED","ANALYZING","TRANSCRIBING","TRANSLATING","AI_QA","WAITING_TRANSLATION_REVIEW","TTS_GENERATING","TTS_QA","WAITING_DUB_REVIEW","RENDER_QUEUED","RENDERING","WAITING_FINAL_REVIEW","COMPLETED"];
const names={CREATED:"已创建",UPLOADING:"上传中",UPLOADED:"已上传",ANALYZING:"媒体分析",TRANSCRIBING:"Gemini 识别",TRANSLATING:"中文翻译",AI_QA:"AI 质检",WAITING_TRANSLATION_REVIEW:"等待字幕审核",TTS_GENERATING:"MiMo 配音",TTS_QA:"配音质检",WAITING_DUB_REVIEW:"等待配音审核",RENDER_QUEUED:"等待渲染",RENDERING:"FFmpeg 渲染",WAITING_FINAL_REVIEW:"等待成片终审",COMPLETED:"已完成",FAILED:"失败"};
async function api(path,opt={}){const r=await fetch(path,opt),ct=r.headers.get("content-type")||"",b=ct.includes("json")?await r.json():await r.text();if(!r.ok)throw new Error(typeof b==="string"?b:b.error||JSON.stringify(b));return b}function fmtDate(v){return v?new Date(Number(v)).toLocaleString():""}function fmtBytes(n){if(n==null)return"—";let v=Number(n),u=["B","KiB","MiB","GiB"],i=0;while(v>=1024&&i<3){v/=1024;i++}return`${v.toFixed(i?1:0)} ${u[i]}`}function t(ms){const s=Math.max(0,ms)/1000;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}.${String(Math.floor(ms%1000)).padStart(3,"0")}`}
async function health(){try{const h=await api('/api/health');$('#health').textContent=`服务正常 · ${h.pipeline||h.storage}`}catch{$('#health').textContent='服务异常'}}
async function loadProjects(select){const d=await api('/api/projects');state.projects=d.projects||[];renderProjects();if(select)await selectProject(select)}function renderProjects(){const box=$('#projectList');box.innerHTML='';for(const p of state.projects){const b=document.createElement('button');b.className='project-item'+(p.id===state.selected?' active':'');b.innerHTML=`<div class="project-title"></div><div class="project-meta">${names[p.stage]||p.stage} · ${fmtDate(p.updated_at)}</div>`;b.querySelector('.project-title').textContent=p.title;b.onclick=()=>selectProject(p.id);box.appendChild(b)}if(!state.projects.length)box.innerHTML='<div class="muted">还没有项目</div>'}
async function selectProject(id){state.selected=id;$('#welcome').hidden=true;$('#workspace').hidden=false;state.detail=await api(`/api/projects/${id}`);await loadSegments();render();schedule()}
async function loadSegments(){if(!state.selected)return;try{const d=await api(`/api/projects/${state.selected}/segments`);state.segments=d.segments||[]}catch{state.segments=[]}}
function renderStages(stage){const box=$('#stageList');box.innerHTML='';const cur=stages.indexOf(stage);stages.forEach((s,i)=>{const d=document.createElement('div');d.className='stage '+(i<cur?'done':i===cur?'current':'');d.innerHTML=`<i>${i+1}</i><span>${names[s]}</span>`;box.appendChild(d)});if(stage==='FAILED')box.insertAdjacentHTML('afterbegin','<div class="stage current"><i>!</i><span>失败</span></div>')}
function renderSegments(){const body=$('#segmentBody');body.innerHTML='';$('#segmentEmpty').hidden=state.segments.length>0;$('#segmentWrap').hidden=!state.segments.length;for(const s of state.segments){let flags={};try{flags=JSON.parse(s.flags_json||'{}')}catch{}const tr=document.createElement('tr');tr.innerHTML=`<td><b>${s.seq}</b><br><span class="muted">${t(s.start_ms)} → ${t(s.end_ms)}</span></td><td><input class="speaker"></td><td></td><td><textarea class="translation"></textarea></td><td class="statuscell"></td>`;tr.children[2].textContent=s.source_text||'';const sp=tr.querySelector('.speaker'),ta=tr.querySelector('.translation');sp.value=s.speaker_id||'';ta.value=s.final_translation||s.ai_translation||'';const status=tr.querySelector('.statuscell');status.innerHTML=`<span class="flag">${s.status}</span>${flags.needsTimingReview?'<span class="flag">时长需复核</span>':''}${flags.ttsDurationMs?`<div class="muted">TTS ${Math.round(flags.ttsDurationMs)}ms</div>`:''}`;const save=async()=>{try{await api(`/api/projects/${state.selected}/segments/${s.id}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({speakerId:sp.value,finalTranslation:ta.value})})}catch(e){alert(e.message)}};sp.onchange=save;ta.onchange=save;body.appendChild(tr)}}
function render(){const {project,runtime}=state.detail;state.selected=project.id;$('#pageTitle').textContent=project.title;$('#stageBadge').textContent=names[project.stage]||project.stage;$('#updatedAt').textContent=fmtDate(project.updated_at);renderStages(project.stage);let meta={};try{meta=JSON.parse(project.metadata_json||'{}')}catch{}const v=meta.video||{},a=meta.audio||{};$('#mediaDetails').innerHTML=`<div class="metric"><small>时长</small><b>${meta.duration?Number(meta.duration).toFixed(1)+' s':'—'}</b></div><div class="metric"><small>大小</small><b>${fmtBytes(meta.size)}</b></div><div class="metric"><small>视频</small><b>${v.codec||'—'} ${v.width?v.width+'×'+v.height:''}</b></div><div class="metric"><small>音频</small><b>${a.codec||'—'} ${a.channels?a.channels+'ch':''}</b></div>`;$('#runtime').textContent=JSON.stringify({runtime,pipeline:meta.pipeline,translationQa:meta.translationQa},null,2);$('#videoWrap').innerHTML=project.source_key?`<video controls preload="metadata" src="/api/projects/${project.id}/media?target=source"></video>`:'<span class="muted">上传视频后可预览</span>';renderSegments();
const canReview=project.stage==='WAITING_TRANSLATION_REVIEW';$('#approveTranslation').disabled=!canReview;$('#retryProcess').disabled=!project.source_key||['UPLOADING','ANALYZING','TRANSCRIBING','TRANSLATING','AI_QA','TTS_GENERATING','RENDERING'].includes(project.stage);$('#approveDub').disabled=project.stage!=='WAITING_DUB_REVIEW';$('#renderBtn').disabled=!['WAITING_DUB_REVIEW','WAITING_FINAL_REVIEW','FAILED','UPLOADED'].includes(project.stage);$('#completeBtn').disabled=project.stage!=='WAITING_FINAL_REVIEW';
const out=$('#outputArea');if(project.output_key)out.innerHTML=`<div class="video-wrap"><video controls preload="metadata" src="/api/projects/${project.id}/media?target=output"></video></div><div class="row" style="margin-top:10px"><a class="btn secondary" style="text-decoration:none" target="_blank" href="/api/projects/${project.id}/media?target=output">打开成片</a></div>`;else if(project.stage==='FAILED')out.innerHTML=`<div class="error">${meta.pipeline?.error||runtime?.error||'任务失败，请点重新识别翻译或重新渲染。'}</div>`;else out.innerHTML=`<div class="notice">${names[project.stage]||project.stage}</div>`}
function schedule(){clearTimeout(state.timer);const active=state.detail&&['UPLOADING','UPLOADED','ANALYZING','TRANSCRIBING','TRANSLATING','AI_QA','TTS_GENERATING','TTS_QA','RENDER_QUEUED','RENDERING'].includes(state.detail.project.stage);state.timer=setTimeout(async()=>{if(!state.selected)return;try{state.detail=await api(`/api/projects/${state.selected}`);await loadSegments();render();await loadProjects()}catch{}schedule()},active?3000:9000)}
async function upload(file){if(!state.selected||state.uploading)return;state.uploading=true;$('#progress').style.display='block';$('#uploadError').textContent='';let session;try{session=await api(`/api/projects/${state.selected}/uploads/init`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({filename:file.name,contentType:file.type||'application/octet-stream'})});const partSize=8*1024*1024,count=Math.ceil(file.size/partSize),parts=[];for(let i=0;i<count;i++){const chunk=file.slice(i*partSize,Math.min(file.size,(i+1)*partSize)),q=new URLSearchParams({key:session.key,uploadId:session.uploadId,partNumber:String(i+1)}),p=await api(`/api/projects/${state.selected}/uploads/part?${q}`,{method:'PUT',body:chunk});parts.push(p);const pct=Math.round((i+1)/count*100);$('#bar').style.width=pct+'%';$('#progressText').textContent=`上传 ${pct}% (${i+1}/${count})`}await api(`/api/projects/${state.selected}/uploads/complete`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:session.key,uploadId:session.uploadId,parts})});$('#progressText').textContent='上传完成，正在自动分析并识别翻译…';await selectProject(state.selected)}catch(e){$('#uploadError').textContent=e.message;if(session)try{await api(`/api/projects/${state.selected}/uploads/abort`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(session)})}catch{}}finally{state.uploading=false;$('#fileInput').value=''}}
$('#fileInput').onchange=e=>{const f=e.target.files?.[0];if(f)upload(f)};$('#refreshBtn').onclick=()=>state.selected&&selectProject(state.selected);$('#retryProcess').onclick=async()=>{try{await api(`/api/projects/${state.selected}/process`,{method:'POST'});await selectProject(state.selected)}catch(e){alert(e.message)}};$('#approveTranslation').onclick=async()=>{try{await api(`/api/projects/${state.selected}/translation/approve`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voice:$('#voice').value})});await selectProject(state.selected)}catch(e){alert(e.message)}};$('#approveDub').onclick=async()=>{try{await api(`/api/projects/${state.selected}/dub/approve`,{method:'POST'});await selectProject(state.selected)}catch(e){alert(e.message)}};$('#renderBtn').onclick=async()=>{try{await api(`/api/projects/${state.selected}/render`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await selectProject(state.selected)}catch(e){alert(e.message)}};$('#completeBtn').onclick=async()=>{try{await api(`/api/projects/${state.selected}/complete`,{method:'POST'});await selectProject(state.selected)}catch(e){alert(e.message)}};
$('#newProject').onclick=()=>{$('#modal').classList.add('open');$('#projectName').focus()};$('#cancelCreate').onclick=()=>$('#modal').classList.remove('open');$('#confirmCreate').onclick=async()=>{try{const p=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('#projectName').value.trim()||'未命名项目'})});$('#modal').classList.remove('open');$('#projectName').value='';await loadProjects(p.id)}catch(e){$('#createError').textContent=e.message}};$('#projectName').onkeydown=e=>{if(e.key==='Enter')$('#confirmCreate').click()};health();loadProjects();
</script></body></html>
